name: Rockbox builds for PP5002 iPods with flash storage

# Builds Rockbox for the iPod 1G/2G and 3G with pp5002-flash.patch applied
# (inter-block DRQ settle, paced PIO writes, clock-keyed IDE timing), so it
# runs reliably on flash storage: CF cards, SD adapters, the Sphinxmoth bridge.
#
#  - weekly: builds the newest upstream release tag if it has not been built yet
#    and publishes it as one GitHub release per model, "rockbox-<tag>-<model>",
#    each carrying a plain rockbox.ipod; branch builds use the upstream commit
#  - on demand: builds any Rockbox ref (tag, branch, commit); publish is optional
#
# The output is NOT hardware-tested by this workflow. Test a build on a fix3b
# board (boot, a write, playback) before pointing customers at it.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rockbox git ref to build (tag such as v4.0-final, or master)"
        required: true
        default: "master"
      publish:
        description: "Publish the result as a GitHub release"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

env:
  RBDEV_PREFIX: /opt/rbdev
  TARGETS: ipod1g2g ipod3g

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: self

      - name: Pick the Rockbox ref
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ref="${{ inputs.ref }}"
            publish="${{ inputs.publish }}"
          else
            ref=$(git ls-remote --tags --refs https://github.com/Rockbox/rockbox.git 'v*' \
                  | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?(-final)?$' | sort -V | tail -1)
            publish=true
            if gh release view "rockbox-${ref}-ipod1g2g" -R "${{ github.repository }}" >/dev/null 2>&1; then
              echo "release rockbox-${ref}-ipod1g2g already exists, nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          # actions/checkout needs a full SHA for a commit ref; resolve short ones
          if echo "$ref" | grep -qE '^[0-9a-f]{7,39}$'; then
            ref=$(gh api "repos/Rockbox/rockbox/commits/$ref" --jq .sha)
          fi
          echo "Rockbox ref: $ref (publish=$publish)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Check out Rockbox
        if: steps.pick.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: Rockbox/rockbox
          ref: ${{ steps.pick.outputs.ref }}
          path: rockbox
          fetch-depth: 1

      - name: Apply the flash-storage patch
        if: steps.pick.outputs.skip != 'true'
        run: |
          set -eu
          cd rockbox
          git apply --stat ../self/pp5002-flash.patch
          git apply ../self/pp5002-flash.patch
          # Rockbox's own core-wake fix (c33602375, 2025-08-04): without it every
          # 1G/2G build from an older ref (4.0 included) crashes at boot. Apply it
          # when the ref predates it; skip when it is already upstream.
          cw=../self/upstream-core-wake-c33602375.patch
          if git apply --check "$cw" 2>/dev/null; then
            git apply "$cw"; echo "core-wake fix applied (ref predates upstream commit c33602375)"
          elif git apply --check -R "$cw" 2>/dev/null; then
            echo "core-wake fix already upstream in this ref"
          else
            echo "core-wake patch neither applies nor is present: thread-pp.c changed upstream, inspect"; exit 1
          fi
          git diff --stat

      - name: Host packages
        if: steps.pick.outputs.skip != 'true'
        run: |
          sudo apt-get update -q
          # tools/rockboxdev.sh checks for: gcc g++ xz bzip2 gzip make patch makeinfo automake libtool autoconf flex bison
          sudo apt-get install -y -q build-essential texinfo flex bison autoconf automake libtool libtool-bin \
            xz-utils bzip2 gzip patch libgmp-dev libmpfr-dev libmpc-dev zip unzip perl python3 wget curl

      - name: Cache the ARM cross toolchain
        if: steps.pick.outputs.skip != 'true'
        id: tc
        uses: actions/cache@v4
        with:
          path: /opt/rbdev
          key: rbdev-arm-${{ hashFiles('rockbox/tools/rockboxdev.sh') }}

      - name: Build the ARM cross toolchain (cache miss)
        if: steps.pick.outputs.skip != 'true' && steps.tc.outputs.cache-hit != 'true'
        run: |
          set -eu
          sudo mkdir -p "$RBDEV_PREFIX" && sudo chown "$USER" "$RBDEV_PREFIX"
          mkdir -p /tmp/rbdev-dl
          rm -rf /tmp/rbdev-build   # the script insists the build dir does not exist yet
          cd rockbox
          ./tools/rockboxdev.sh --target=a --prefix="$RBDEV_PREFIX" --dlwhere=/tmp/rbdev-dl --builddir=/tmp/rbdev-build
          ls "$RBDEV_PREFIX/bin"

      - name: Build the targets
        if: steps.pick.outputs.skip != 'true'
        run: |
          set -eu
          export PATH="$RBDEV_PREFIX/bin:$PATH"
          arm-elf-eabi-gcc --version | head -1
          mkdir -p out
          for t in $TARGETS; do
            echo "=== $t"
            rm -rf "rockbox/build-$t" && mkdir "rockbox/build-$t" && cd "rockbox/build-$t"
            ../tools/configure --target="$t" --type=n
            make -j"$(nproc)" >/dev/null
            make zip >/dev/null
            mkdir -p "../../out/$t"
            cp rockbox.ipod "../../out/$t/rockbox.ipod"
            cp rockbox.zip "../../out/$t/rockbox-$t-pp5002-flash.zip"
            cp rockbox-info.txt "../../out/$t/rockbox-info.txt"
            ( cd "../../out/$t" && sha256sum rockbox.ipod "rockbox-$t-pp5002-flash.zip" > checksums.txt && cat checksums.txt )
            cd ../..
          done
          grep -h "^Version" out/*/rockbox-info.txt | sort -u

      - name: Upload build artifacts
        if: steps.pick.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-${{ steps.pick.outputs.ref }}-pp5002-flash
          path: out/
          if-no-files-found: error

      - name: Publish as GitHub releases (one per iPod model)
        if: steps.pick.outputs.skip != 'true' && steps.pick.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ref="${{ steps.pick.outputs.ref }}"
          ver=$(grep -h "^Version" out/ipod1g2g/rockbox-info.txt | cut -d' ' -f2)
          # release builds are named after the upstream tag, branch builds after
          # the exact upstream commit, so each tested build keeps its own URL.
          # One release per model so the binary can be a plain rockbox.ipod.
          case "$ref" in v*) base="rockbox-${ref}" ;; *) base="rockbox-$(git -C rockbox rev-parse --short=10 HEAD)" ;; esac
          for t in $TARGETS; do
            case "$t" in ipod1g2g) model="iPod 1G/2G" ;; ipod3g) model="iPod 3G" ;; *) model="$t" ;; esac
            tag="${base}-${t}"
            rm -rf release && mkdir release
            cp "out/$t/rockbox.ipod" release/rockbox.ipod
            cp "out/$t/rockbox-$t-pp5002-flash.zip" "release/rockbox-$t-full-install.zip"
            ( cd release && sha256sum * > SHA256SUMS.txt )
            notes=$(printf '%s\n\n%s\n' \
              "Rockbox ${ver} (upstream ref ${ref}) for the ${model} with pp5002-flash.patch applied: inter-block DRQ settle, paced PIO data writes and clock-keyed IDE timing, for flash storage (CF cards, SD adapters, the Sphinxmoth bridge)." \
              "Install a Rockbox development build with Rockbox Utility, then copy rockbox.ipod over .rockbox/rockbox.ipod on the iPod (no renaming needed), or unzip the full install over the iPod. Built automatically; not hardware-tested by this workflow.")
            if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "$tag" release/* --clobber -R "${{ github.repository }}"
              gh release edit "$tag" --notes "$notes" -R "${{ github.repository }}"
            else
              gh release create "$tag" release/* --title "Rockbox ${ver} for ${model} (flash storage fix)" --notes "$notes" --prerelease --latest=false -R "${{ github.repository }}"
            fi
          done
